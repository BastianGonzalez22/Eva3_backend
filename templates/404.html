{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card card-pro p-5 shadow-sm mt-4">
            <div class="mb-3 text-warning">
                <i class="bi bi-exclamation-triangle-fill display-1"></i>
            </div>
            <h1 class="fw-bold text-danger mb-2">Error 404</h1>
            <h4 class="fw-semibold text-dark mb-3">Página no encontrada</h4>
            <p class="text-muted mb-4">Lo sentimos, el recurso o la página que buscando no existe, fue eliminada o la dirección está mal escrita.</p>
            <a href="{% url 'inicio' %}" class="btn btn-warning fw-bold px-4 py-2 shadow-sm text-dark">
                <i class="bi bi-house-door-fill me-2"></i> Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
